services:
    # ==========================================
    # POSTGRESQL - Order & Payment
    # ==========================================

    postgresql:
      container_name: sakafo_postgresql
      image: postgres:17
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: sakafo
        PGDATA: /var/lib/postgresql/data/pgdata
      volumes:
        - postgres:/var/lib/postgresql/data
        - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      ports:
        - "5433:5432"
      networks:
        - microservices-net
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d sakafo"]
        interval: 10s
        timeout: 5s
        retries: 5

    pgadmin:
      container_name: sakafo_pgadmin
      image: dpage/pgadmin4:9
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
        PGADMIN_CONFIG_SERVER_MODE: "False"
      volumes:
        - pgadmin:/var/lib/pgadmin
      ports:
        - "5050:80"
      networks:
        - microservices-net
      depends_on:
        postgresql:
          condition: service_healthy
      restart: unless-stopped

    # ==========================================
    # MONGODB - Customer & Notification
    # ==========================================
    mongodb:
      container_name: sakafo_mongodb
      image: mongo:8.0
      environment:
        MONGO_INITDB_ROOT_USERNAME: mongod
        MONGO_INITDB_ROOT_PASSWORD: mongod
      volumes:
        - mongo:/data/db
      ports:
        - "27017:27017"
      networks:
        - microservices-net
      restart: unless-stopped
      healthcheck:
        test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
        interval: 10s
        timeout: 5s
        retries: 5

    # ==========================================
    # MONGO EXPRESS - MongoDB administration
    # ==========================================
    mongo-express:
      container_name: sakafo_mongo_express
      image: mongo-express:1.0.2-20
      environment:
        ME_CONFIG_MONGODB_URL: mongodb://mongod:mongod@mongodb:27017/?authSource=admin
        ME_CONFIG_BASICAUTH: "false"
      ports:
        - "8081:8081"
      networks:
        - microservices-net
      depends_on:
        mongodb:
          condition: service_healthy
      restart: unless-stopped

    # ==========================================
    # ZOOKEEPER - Kafka coordination
    # ==========================================
    zookeeper:
      container_name: sakafo_zookeeper
      image: confluentinc/cp-zookeeper:7.8.12
      environment:
        ZOOKEEPER_SERVER_ID: 1
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      ports:
        - "22181:2181"
      networks:
        - microservices-net
      restart: unless-stopped

    # ==========================================
    # KAFKA - Asynchronous communication
    # ==========================================
    kafka:
      container_name: sakafo_kafka
      image: confluentinc/cp-kafka:7.8.12
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

        KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      networks:
        - microservices-net
      restart: unless-stopped

    # ==========================================
    # MAILDEV - Email testing
    # ==========================================
    mail-dev:
      container_name: sakafo_mail_dev
      image: maildev/maildev:2.2.1
      ports:
        - "1080:1080"
        - "1025:1025"
      networks:
        - microservices-net
      restart: unless-stopped

    # ==========================================
    # ZIPKIN - Distributed tracing
    # ==========================================
    zipkin:
      container_name: sakafo_zipkin
      image: openzipkin/zipkin:3
      ports:
        - "9411:9411"
      networks:
        - microservices-net
      restart: unless-stopped

    # ==========================================
    # NETWORK
    # ==========================================
networks:
      microservices-net:
        driver: bridge

  # ==========================================
  # PERSISTENT VOLUMES
  # ==========================================
volumes:
      postgres:
      pgadmin:
      mongo:
