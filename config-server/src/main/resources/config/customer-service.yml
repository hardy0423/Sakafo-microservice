server:
  port: 8082

spring:
  application:
    name: customer-service
  mongodb:
    uri: mongodb://mongod:mongod@localhost:27017/sakafo_customer?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true