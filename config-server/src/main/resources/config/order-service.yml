server:
  port: 8084

spring:
  application:
    name: order-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/sakafo_order
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    show-sql: true
    open-in-view: false

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderConfirmation:com.hardy.sakafo.order.kafka.OrderConfirmation

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

application:
  config:
    customer-url: http://localhost:8082/api/v1/customers
    product-url: http://localhost:8083/api/v1/products
    payment-url: http://localhost:8085/api/v1/payments

management:
  endpoints:
    web:
      exposure:
        include: health,info
